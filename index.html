<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="News and updates for staff and students" />
  <title>School News</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="nav-logo" href="#" aria-label="Home">
        <div class="nav-logo-badge" data-school-short>RA</div>
        <span class="nav-logo-text" data-publication>The Weekly Brief</span>
      </a>
      <div class="nav-spacer"></div>
      <div class="search-wrap" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="search" placeholder="Search articles…"
               aria-label="Search articles" autocomplete="off" />
      </div>
      <button id="theme-btn" class="theme-btn" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="page" id="main">
    <section id="hero" class="hero" role="article" aria-label="Featured article" tabindex="0">
      <span id="hero-tag" class="hero-tag">Category</span>
      <h1 id="hero-title">Loading…</h1>
      <p id="hero-summary" class="hero-summary"></p>
      <div class="hero-meta">
        <span id="hero-author"></span>
        <span id="hero-date"></span>
      </div>
      <span class="hero-read-btn" aria-hidden="true">
        Read article
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </span>
    </section>

    <div class="section-header">
      <h2 class="section-title">Recent Articles</h2>
      <span id="article-count" class="section-count"></span>
    </div>
    <div id="filter-bar" class="filter-bar" role="group" aria-label="Filter by category"></div>
    <div id="news-grid" class="news-grid" role="list" aria-label="News articles"></div>
  </main>

  <footer>
    <p data-footer-note></p>
  </footer>

  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true"
       aria-labelledby="modal-title">
    <div class="modal">
      <button id="modal-close" class="modal-close" aria-label="Close article">✕</button>
      <span id="modal-tag" class="modal-tag"></span>
      <h2 id="modal-title" class="modal-title"></h2>
      <div class="modal-meta">
        <span id="modal-author"></span>
        <span id="modal-date"></span>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="news-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
